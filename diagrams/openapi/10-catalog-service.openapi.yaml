openapi: 3.1.1
info:
  title: Catalog Service API
  version: 1.1.0
  description: Получение и административное управление устройствами, модулями, комплектами, публикацией и совместимостью.
servers:
- url: https://api.smart-home.example.com/catalog/v1
  description: Доступ через API Gateway
- url: http://catalog:8080/v1
  description: Внутренний адрес сервиса
security:
- bearerAuth: []
tags:
- name: Catalog
- name: Bundles
- name: Compatibility
paths:
  /catalog/items:
    get:
      tags:
      - Catalog
      summary: Поиск устройств и модулей
      parameters:
      - name: query
        in: query
        schema:
          type: string
      - name: itemType
        in: query
        schema:
          type: string
      - name: active
        in: query
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Элементы каталога
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogItem'
    post:
      tags:
      - Catalog
      summary: Создать элемент каталога
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCatalogItemRequest'
      responses:
        '201':
          description: Элемент создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /catalog/items/{itemId}:
    parameters:
    - name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Catalog
      summary: Получить элемент каталога
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Catalog
      summary: Изменить элемент каталога
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCatalogItemRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogItem'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Catalog
      summary: Удалить элемент каталога
      responses:
        '204':
          description: Элемент удалён
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /catalog/items/{itemId}/compatibility:
    parameters:
    - name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Compatibility
      summary: Получить совместимые и несовместимые элементы
      responses:
        '200':
          description: Совместимость
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Compatibility'
    post:
      tags:
      - Compatibility
      summary: Добавить правило совместимости
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompatibilityRequest'
      responses:
        '201':
          description: Правило создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Compatibility'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /catalog/bundles:
    get:
      tags:
      - Bundles
      summary: Список комплектов
      responses:
        '200':
          description: Комплекты
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Bundle'
    post:
      tags:
      - Bundles
      summary: Создать комплект
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBundleRequest'
      responses:
        '201':
          description: Комплект создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bundle'
        '400':
          $ref: '#/components/responses/BadRequest'
  /catalog/bundles/{bundleId}:
    parameters:
    - name: bundleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      tags:
      - Bundles
      summary: Получить комплект
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bundle'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Bundles
      summary: Изменить комплект
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBundleRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bundle'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Bundles
      summary: Удалить комплект
      responses:
        '204':
          description: Комплект удалён
        '404':
          $ref: '#/components/responses/NotFound'
  /catalog/compatibility/{compatibilityId}:
    parameters:
    - name: compatibilityId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      tags:
      - Compatibility
      summary: Изменить правило совместимости
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompatibilityRequest'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Compatibility'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Compatibility
      summary: Удалить правило совместимости
      responses:
        '204':
          description: Правило удалено
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Некорректные параметры запроса
        details:
          type: object
          additionalProperties: true
        traceId:
          type: string
          example: 01J0TRACEIDEXAMPLE
    PageInfo:
      type: object
      required:
      - limit
      - offset
      - total
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 1000
        offset:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    CatalogItem:
      type: object
      required:
      - id
      - sku
      - name
      - itemType
      - publicationStatus
      properties:
        id:
          type: string
          format: uuid
        deviceModelId:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
        sku:
          type: string
        name:
          type: string
        itemType:
          type: string
          enum:
          - DEVICE
          - MODULE
          - ACCESSORY
        description:
          type:
          - string
          - 'null'
        connectionParameters:
          type: object
          additionalProperties: true
        publicationStatus:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - ARCHIVED
        createdAt:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        updatedAt:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
    BundleItem:
      type: object
      required:
      - item
      - quantity
      properties:
        item:
          $ref: '#/components/schemas/CatalogItem'
        quantity:
          type: integer
          minimum: 1
    Bundle:
      type: object
      required:
      - id
      - name
      - publicationStatus
      - items
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/BundleItem'
        publicationStatus:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - ARCHIVED
        createdAt:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
        updatedAt:
          oneOf:
          - type: string
            format: date-time
          - type: 'null'
    Compatibility:
      type: object
      required:
      - sourceItemId
      - targetItemId
      - relationType
      properties:
        sourceItemId:
          type: string
          format: uuid
        targetItemId:
          type: string
          format: uuid
        relationType:
          type: string
          enum:
          - COMPATIBLE
          - REQUIRES
          - INCOMPATIBLE
        notes:
          type:
          - string
          - 'null'
    CreateCatalogItemRequest:
      type: object
      required:
      - sku
      - name
      - itemType
      properties:
        deviceModelId:
          oneOf:
          - type: string
            format: uuid
          - type: 'null'
        sku:
          type: string
        name:
          type: string
        itemType:
          type: string
          enum:
          - DEVICE
          - MODULE
          - ACCESSORY
        description:
          type:
          - string
          - 'null'
        connectionParameters:
          type: object
          additionalProperties: true
        publicationStatus:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - ARCHIVED
          default: DRAFT
    UpdateCatalogItemRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        connectionParameters:
          type: object
          additionalProperties: true
        publicationStatus:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - ARCHIVED
    BundleItemRequest:
      type: object
      required:
      - catalogItemId
      - quantity
      properties:
        catalogItemId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
    CreateBundleRequest:
      type: object
      required:
      - name
      - items
      properties:
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        publicationStatus:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - ARCHIVED
          default: DRAFT
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BundleItemRequest'
    UpdateBundleRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type:
          - string
          - 'null'
        publicationStatus:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
          - ARCHIVED
        items:
          type: array
          items:
            $ref: '#/components/schemas/BundleItemRequest'
    CreateCompatibilityRequest:
      type: object
      required:
      - targetItemId
      - relationType
      properties:
        targetItemId:
          type: string
          format: uuid
        relationType:
          type: string
          enum:
          - COMPATIBLE
          - REQUIRES
          - INCOMPATIBLE
        notes:
          type:
          - string
          - 'null'
    UpdateCompatibilityRequest:
      type: object
      properties:
        relationType:
          type: string
          enum:
          - COMPATIBLE
          - REQUIRES
          - INCOMPATIBLE
        notes:
          type:
          - string
          - 'null'
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Требуется аутентификация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Конфликт состояния ресурса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
